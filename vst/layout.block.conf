text cx=60 cy=240 label="POTENTIALWARP: BEND TIME ON THE BEAT" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:0
text cx=60 cy=280 label="A tempo-locked mangler. Tap one of 16 patterns and whatever runs through it stutters, drops to half speed, runs" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=312 label="down like a stopped tape, spins back, plays backwards or gates in time with your beat." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=360 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=360 label="Add it as an insert effect on a track, program, pad or bus. It is not in the instrument list." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=392 label="Press Play on the MPC, then tap a pattern." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=424 label="Try Half Time or Tape Stop on a drum bus, Stutter or Roll Up on a break, Reverse on a vocal chop." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:0
text cx=84 cy=456 label="The strip at the top shows the pattern step by step, with a light under the step that is playing." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=504 label="The full PotentialSuite manual: github.com/PotentialBreakfast/potential-plugins" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:0
text cx=60 cy=240 label="CONTROLS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:1
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=280 label="PATTERNS: 16 one-tap pads, also in the MPC's PRESET menu." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=312 label="LENGTH: how long the 16 steps last. 1/2 BAR, 1 BAR, 2 BARS or 4 BARS." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=344 label="SWING: 50 % (straight) to 75 %, MPC style." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=376 label="FADE: TIGHT (short, punchy jumps) or SOFT (smoother)." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=408 label="WARP: ON or OFF. Automate it to drop the effect in and out." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=440 label="PLAY: ALWAYS runs with the song. ONE SHOT plays a pattern once from the next 16th. HOLD plays only while you" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=472 label="hold a pad. Pads A01 to A16 play patterns 1 to 16." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=504 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=504 label="STOP FILTER: a low-pass that closes as a Tape Stop runs down and opens as a Tape Start spins up." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=62 cy=536 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:1
text cx=84 cy=536 label="MIX: blend with the original sound. OUTPUT: the level after the effect." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:1
text cx=60 cy=240 label="PATTERNS AND MOVES" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:2
text cx=60 cy=280 label="Half Time, Tape Stop, Stop Start, Stutter, Roll Up, Beat Repeat, Reverse, Spinback, Gate 16ths, Gate 8ths, Chop," size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=60 cy=312 label="Half End, Slow Mo, Glitch, Wobble and Mangle." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=60 cy=360 label="Each of the 16 steps does one move:" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=392 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=392 label="Straight: the sound as it is. Silent: gates the sound out." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=424 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=424 label="1/2 or 1/4 speed: drops an octave or two and drags behind the beat." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=456 label="Tape stop or start: slows to a stop, or spins up from silence." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=488 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=488 label="Repeat: stutters a slice, from an 8th down to a 64th roll, with triplets." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=62 cy=520 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:2
text cx=84 cy=520 label="Backwards or Spinback: the last moment in reverse, or a fast spinback." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:2
text cx=60 cy=240 label="EDIT AND CHAIN PAGES" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:3
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=280 label="EDIT: tap a step, then tap what it does. Steps next to each other with the same move join into one longer" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=312 label="move." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=344 label="ROLL rolls a brand-new pattern for the pad. MILD, MEDIUM or WILD sets how far it goes." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=376 label="RESET PAD puts the pad's own pattern back. An edited pad shows EDITED after its name." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=408 label="Every pad's pattern is saved with your project." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=456 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=456 label="CHAIN: tap a slot (1 to 8), then the pattern for it, and turn CHAIN on." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=488 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=488 label="The slots play in turn, one LENGTH each, and start again after the last one or at the first END." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=62 cy=520 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:3
text cx=84 cy=520 label="A chain like Half Time, Half Time, Stutter, Tape Stop changes over a phrase by itself." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:3
text cx=60 cy=240 label="WITH THE OTHER PLUGINS" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:4
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=280 label="Put Warp last on the inserts, after Punch, Grit, Bleed and Patina, so it bends the finished sound." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=312 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=312 label="After the Break Bus chain it gives half time and tape stops on a whole dusty drum bus." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=344 label="Grit's ECHO and CHOP are also locked to the tempo. Use one time-based effect at a time for a clean result, or" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=376 label="stack them for chaos." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:4
text cx=84 cy=408 label="For a live feel, map WARP or PATTERN to a Q-Link and record the moves as automation." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:4
text cx=60 cy=240 label="GOOD TO KNOW" size=1.9 weight=700 align=left color=0e1f1b when=manual_page:5
text cx=62 cy=280 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=280 label="It follows the song position. Patterns line up with your bars while the sequence plays. When it is stopped," size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=312 label="it keeps its own time at the project tempo." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=344 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=344 label="4/4 time: one bar is four beats." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=376 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=376 label="It can only use what it has already heard: backwards plays the moment just before, in reverse." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=408 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=408 label="HOLD needs pads or keys. The touchscreen does not tell a plugin when your finger lifts." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=440 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=440 label="Q-Links: PATTERN, LENGTH, MIX, OUTPUT, WARP, FADE, SWING and PLAY." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=62 cy=472 label="-" size=1.45 weight=700 case=none align=left color=0e1f1b when=manual_page:5
text cx=84 cy=472 label="Looks: Print Plate, Night Rack, Colour Block or Vintage, on the SETTINGS page." size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
text cx=60 cy=520 label="Ideas, bugs and criticism are all welcome: github.com/PotentialBreakfast/mpc-vst-potentialwarp" size=1.45 weight=600 case=none align=left color=0e1f1b when=manual_page:5
qlinks "MANUAL" = -
